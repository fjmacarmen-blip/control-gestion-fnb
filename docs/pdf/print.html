<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Documento maquetado para impresión a PDF · Plataforma F&B v5.3">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#059669">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="print.css">
<title>Cargando documento…</title>
</head>
<body>
<button class="print-cta" id="btnPrint" onclick="window.print()">🖨️ Guardar como PDF</button>
<div class="print-hint">
  Pulsa el botón o usa <strong>Ctrl + P</strong> (Cmd+P en Mac) y elige <em>«Guardar como PDF»</em> en el destino.
</div>
<article id="content">
  <p style="color:#64748b;text-align:center;padding:40px 20px;">Cargando documento…</p>
</article>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script>
'use strict';

// docs/pdf/print.html?doc=RESUMEN-EJECUTIVO · CASE-STUDY · COMERCIALIZACION
const params = new URLSearchParams(location.search);
const docName = (params.get('doc') || 'RESUMEN-EJECUTIVO').replace(/[^a-z0-9-]/gi, '');
const titleMap = {
  'RESUMEN-EJECUTIVO': 'Resumen ejecutivo',
  'CASE-STUDY': 'Case study',
  'COMERCIALIZACION': 'Plan de comercialización',
  'DETALLE-PROYECTO': 'Detalle del proyecto',
  'AUDITORIA-v4.14': 'Auditoría de ingeniería v4.14',
};
const docTitle = titleMap[docName] || docName;
document.title = docTitle + ' · F&B';

async function render() {
  try {
    const res = await fetch('../' + docName + '.md', { cache: 'no-store' });
    if (!res.ok) throw new Error('No se encontró ../' + docName + '.md (' + res.status + ')');
    const md = await res.text();
    const html = marked.parse(md, { gfm: true, breaks: false });
    const today = new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
    const cover = `
      <header class="cover">
        <div class="eyebrow">Plataforma F&amp;B · v5.3</div>
        <div class="meta">
          Francisco Javier Martínez Alba · Algeciras<br>
          <a href="https://www.linkedin.com/in/franciscojaviermartinezalba">LinkedIn</a> ·
          <a href="https://fjmacarmen-blip.github.io/control-gestion-fnb/">demo en vivo</a> ·
          Generado el ${today}
        </div>
      </header>`;
    document.getElementById('content').innerHTML = cover + html;
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div style="color:#dc2626;padding:40px 20px;">' +
      '<h2>Error cargando documento</h2>' +
      '<p>' + (e.message || 'Error desconocido') + '</p>' +
      '<p style="font-size:11pt;color:#64748b;">Asegúrate de servir esto desde un servidor (no <code>file://</code>). ' +
      'En GitHub Pages funciona directamente.</p></div>';
  }
}
render();
</script>
</body>
</html>
