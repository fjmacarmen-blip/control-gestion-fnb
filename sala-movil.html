<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; overscroll-behavior-y: contain; }
  body {
    background: var(--bg-base);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bot);
  }

  /* ── Top bar ───────────────────────────────────── */
  .topbar {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-default);
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(10px);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 40px; height: 40px;
    border-radius: 9px;
    overflow: hidden;
    box-shadow: 0 4px 12px rgba(10,23,51,.4);
  }
  .brand-mark img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .brand-info { display: flex; flex-direction: column; gap: 2px; }
  .brand-name { font-size: 14px; font-weight: 600; line-height: 1; }
  .brand-proj { font-size: 10px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; line-height: 1; }
  .conn { font-size: 10px; padding: 3px 8px; border-radius: 100px; }
  .conn.online { background: rgba(52,211,153,.12); color: var(--accent); border: 1px solid rgba(52,211,153,.3); }
  .conn.offline { background: rgba(248,81,73,.12); color: var(--danger); border: 1px solid rgba(248,81,73,.3); }

  /* ── Tabs grandes para dedo ───────────────────────── */
  .tabs {
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--bg-base);
    border-bottom: 1px solid var(--border-default);
    position: sticky; top: 61px; z-index: 49;
  }
  .tab {
    padding: 14px 8px;
    text-align: center;
    font-size: 13px; font-weight: 500;
    color: var(--text-soft);
    background: transparent;
    border: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    min-height: 50px;
  }
  .tab.is-active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab-ico { display: block; font-size: 18px; margin-bottom: 2px; }

  /* ── Contenido ──────────────────────────────────── */
  main { padding: 18px 16px 100px; }
  .section-title {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-muted); margin: 22px 0 12px;
  }
  .section-title:first-child { margin-top: 0; }

  /* ── Card de evento ─────────────────────────────── */
  .ev-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .ev-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; margin-bottom: 12px;
  }
  .ev-title { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .ev-ref {
    font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;
    background: var(--bg-elevated); padding: 3px 8px; border-radius: 6px;
    white-space: nowrap;
  }
  .ev-meta {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    padding: 12px 0; border-top: 1px solid var(--border-default);
  }
  .ev-meta-item { display: flex; flex-direction: column; gap: 3px; }
  .ev-meta-label { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-muted); }
  .ev-meta-value { font-size: 14px; font-weight: 500; color: var(--text); }
  .ev-meta-value strong { color: var(--accent); }
  .ev-pax {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-elevated);
    padding: 10px 14px;
    border-radius: 10px;
    margin-top: 12px;
    font-size: 13px;
  }
  .ev-pax-icon { font-size: 18px; }

  /* ── Pulseras de dietas ─────────────────────────── */
  .diet-row {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-top: 12px;
  }
  .diet-pill {
    padding: 7px 12px;
    border-radius: 100px;
    font-size: 12px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .diet-count { background: rgba(0,0,0,.25); padding: 1px 7px; border-radius: 100px; font-size: 11px; }

  /* ── Card de dieta crítica ──────────────────────── */
  .crit-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-left-width: 4px;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .crit-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .crit-name { font-size: 15px; font-weight: 600; }
  .crit-pulsera { font-size: 11px; padding: 3px 9px; border-radius: 6px; }
  .crit-body { font-size: 13px; color: var(--text-soft); line-height: 1.55; }
  .crit-instr {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 12px;
    margin-top: 10px; font-size: 12px;
  }
  .crit-instr dt { color: var(--text-muted); }
  .crit-instr dd { color: var(--text); }

  /* ── Card de espacio ────────────────────────────── */
  .space-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .space-head { display: flex; justify-content: space-between; align-items: center; }
  .space-name { font-size: 15px; font-weight: 600; }
  .space-pax { font-size: 12px; color: var(--accent); }
  .space-progress { height: 4px; background: var(--bg-elevated); border-radius: 100px; margin-top: 10px; overflow: hidden; }
  .space-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent) 0%, var(--accent-deep) 100%); border-radius: 100px; }

  /* ── Empty state ────────────────────────────────── */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-icon { font-size: 48px; margin-bottom: 14px; opacity: .5; }
  .empty-text { font-size: 14px; }

  /* ── Footer · selector de proyecto ───────────────── */
  .proj-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-surface);
    border-top: 1px solid var(--border-default);
    padding: 12px 16px calc(12px + var(--safe-bot));
    display: flex; gap: 8px; align-items: center;
    z-index: 60;
    backdrop-filter: blur(10px);
  }
  .proj-bar label { font-size: 11px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; }
  .proj-bar select {
    flex: 1;
    background: var(--bg-elevated);
    border: 1px solid var(--border-default);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
  }
  .proj-bar select:focus { outline: none; border-color: var(--accent); }

  /* ── TPV log ─────────────────────────────────────── */
  .tpv-toolbar {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .tpv-btn {
    flex: 1; min-width: 120px;
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    font-family: inherit; font-size: 13px;
    cursor: pointer; min-height: 44px;
  }
  .tpv-btn.primary {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
    color: var(--bg-base); font-weight: 600; border-color: transparent;
  }
  .tpv-status {
    font-size: 11px; color: var(--text-muted);
    margin-bottom: 14px; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .tpv-event {
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13px;
    border-left: 3px solid var(--accent);
  }
  .tpv-event.cerrado { border-left-color: var(--info); }
  .tpv-event.comanda { border-left-color: var(--warning); }
  .tpv-event.liberada { border-left-color: var(--text-muted); }
  .tpv-event-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px;
  }
  .tpv-event-type {
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 600;
  }
  .tpv-event.cerrado .tpv-event-type { color: var(--info); }
  .tpv-event.comanda .tpv-event-type { color: var(--warning); }
  .tpv-event.liberada .tpv-event-type { color: var(--text-muted); }
  .tpv-event-time { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
  .tpv-event-body { color: var(--text); font-size: 13px; line-height: 1.4; }

  /* ── Tablet ───────────────────────────────────────── */
  @media (min-width: 768px) {
    main { max-width: 720px; margin: 0 auto; padding: 28px 24px 120px; }
    .topbar { padding: 16px 28px; }
    .ev-meta { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><img src="branding/favicon/icon-192.png" alt="Queens Bellybutton" width="40" height="40"></div>
      <div class="brand-info">
        <div class="brand-name" data-i18n="sala.title">Sala</div>
        <div class="brand-proj" id="brandProj" data-i18n="common.loading">cargando…</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div id="i18nSlotSala"></div>
      <div id="connStatus" class="conn online">● online</div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="hoy" role="tab"><span class="tab-ico">📅</span><span data-i18n="sala.tab_today">Hoy</span></button>
    <button class="tab" data-tab="dietas" role="tab"><span class="tab-ico">🎗️</span><span data-i18n="sala.tab_diets">Dietas</span></button>
    <button class="tab" data-tab="espacios" role="tab"><span class="tab-ico">🏛️</span><span data-i18n="sala.tab_spaces">Espacios</span></button>
    <button class="tab" data-tab="tpv" role="tab"><span class="tab-ico">🧾</span><span data-i18n="sala.tab_tpv">TPV</span></button>
  </nav>

  <main id="content">
    <div class="empty"><div class="empty-icon">⏳</div><div class="empty-text">Cargando datos del proyecto…</div></div>
  </main>

  <div class="proj-bar">
    <label for="projSelect">Proyecto</label>
    <select id="projSelect"></select>
  </div>

<script src="core/js/theme.js"></script>
<script src="core/js/loader.js"></script>
<script src="core/js/i18n.js"></script>
<script src="core/js/metrics.js"></script>
<script src="core/js/tpv-connector.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const params = new URLSearchParams(location.search);
let currentProj = params.get('proyecto') || 'miramar';
let currentTab = params.get('vista') || 'hoy';
let projectData = null;
let budgets = [];

// ── Conectividad ───────────────────────
function updateConnStatus() {
  const el = $('#connStatus');
  if (navigator.onLine) { el.className = 'conn online'; el.textContent = '● online'; }
  else { el.className = 'conn offline'; el.textContent = '● offline'; }
}
window.addEventListener('online', updateConnStatus);
window.addEventListener('offline', updateConnStatus);
updateConnStatus();

// ── Helpers ─────────────────────────────
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function fmtTime(t) { return t || '—'; }
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'short' });
}
function isToday(iso) {
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(iso + 'T00:00:00');
  return t.getTime() === d.getTime();
}
function isThisWeek(iso) {
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(iso + 'T00:00:00');
  const diff = (d - t) / 86400000;
  return diff >= 0 && diff <= 7;
}

// ── Tabs ────────────────────────────────
$$('.tab').forEach(t => {
  t.addEventListener('click', () => {
    currentTab = t.dataset.tab;
    $$('.tab').forEach(x => x.classList.toggle('is-active', x === t));
    render();
    // Persistir
    const u = new URL(location.href); u.searchParams.set('vista', currentTab);
    history.replaceState(null, '', u);
  });
  if (t.dataset.tab === currentTab) {
    $$('.tab').forEach(x => x.classList.toggle('is-active', x.dataset.tab === currentTab));
  }
});

// ── Project switcher ────────────────────
async function loadProjectsList() {
  try {
    const res = await fetch('projects/index.json');
    const idx = await res.json();
    const select = $('#projSelect');
    select.innerHTML = '';
    (idx.proyectos || []).filter(p => !p.archivado).forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id; opt.textContent = p.id;
      select.appendChild(opt);
    });
    select.value = currentProj;
    select.addEventListener('change', () => {
      currentProj = select.value;
      const u = new URL(location.href); u.searchParams.set('proyecto', currentProj);
      location.href = u.toString();
    });
  } catch (e) {
    console.warn('No se pudo leer projects/index.json', e);
  }
}

// ── Carga datos ─────────────────────────
async function loadAll() {
  try {
    projectData = await window.loadProject(currentProj);
    $('#brandProj').textContent = (projectData.establecimiento && projectData.establecimiento.nombre_comercial) || currentProj;
  } catch (e) {
    $('#content').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">No se pudo cargar el proyecto «' + escapeHtml(currentProj) + '»</div></div>';
    return;
  }
  budgets = await window.fnbMetrics.loadBudgets(currentProj);
  render();
}

// ── Render ──────────────────────────────
function render() {
  const main = $('#content');
  if (currentTab === 'hoy') return renderHoy(main);
  if (currentTab === 'dietas') return renderDietas(main);
  if (currentTab === 'espacios') return renderEspacios(main);
  if (currentTab === 'tpv') return renderTPV(main);
}

// ── TPV (simulator) ─────────────────────────
let tpvConnector = null;
let tpvLog = [];

function renderTPV(root) {
  root.innerHTML = `
    <div class="section-title">Eventos TPV en directo (simulador)</div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:14px;line-height:1.5;">
      Lanza un escenario y verás los eventos que llegarían del TPV en tiempo real.
      Útil para entrenar al equipo de sala antes del primer servicio.
      <a href="docs/adr/013-tpv-connectors.md" style="color:var(--accent);">ADR 013</a>.
    </div>
    <div class="tpv-toolbar">
      <button class="tpv-btn primary" data-tpv="comida_normal">▶ Comida normal</button>
      <button class="tpv-btn primary" data-tpv="evento_grande">▶ Evento grande</button>
      <button class="tpv-btn" data-tpv="clear">✕ Limpiar</button>
    </div>
    <div class="tpv-status" id="tpvStatus">Inactivo · pulsa un escenario</div>
    <div id="tpvLog"></div>
  `;
  $$('[data-tpv]').forEach(btn => {
    btn.addEventListener('click', () => {
      const scn = btn.dataset.tpv;
      if (scn === 'clear') { tpvLog = []; renderTpvLog(); $('#tpvStatus').textContent = 'Log limpio'; return; }
      startTpvScenario(scn);
    });
  });
  renderTpvLog();
}

function startTpvScenario(scenarioId) {
  if (tpvConnector) tpvConnector.stop();
  tpvConnector = window.fnbTPV.createConnector('simulator');
  const EVENTS = ['ticket_abierto', 'comanda_enviada', 'ticket_cerrado', 'mesa_liberada'];
  EVENTS.forEach(ev => tpvConnector.on(ev, (e) => {
    tpvLog.unshift(e);
    if (tpvLog.length > 20) tpvLog.pop();
    renderTpvLog();
  }));
  const count = tpvConnector.simulate(scenarioId);
  $('#tpvStatus').textContent = '▶ Escenario «' + scenarioId + '» · ' + count + ' eventos programados';
}

function renderTpvLog() {
  const root = $('#tpvLog');
  if (!root) return;
  if (!tpvLog.length) {
    root.innerHTML = '<div class="empty" style="padding:40px 20px;"><div class="empty-icon">📡</div><div class="empty-text">Sin eventos todavía.</div></div>';
    return;
  }
  const labels = {
    ticket_abierto: 'TICKET ABIERTO',
    comanda_enviada: 'COMANDA',
    ticket_cerrado: 'TICKET CERRADO',
    mesa_liberada: 'MESA LIBERADA',
  };
  const cls = { ticket_abierto: '', comanda_enviada: 'comanda', ticket_cerrado: 'cerrado', mesa_liberada: 'liberada' };
  root.innerHTML = tpvLog.map(e => {
    const time = e.ts ? new Date(e.ts).toLocaleTimeString('es-ES') : '—';
    let body = 'Mesa <strong>' + escapeHtml(String(e.mesa || '—')) + '</strong>';
    if (e.camarero) body += ' · ' + escapeHtml(e.camarero);
    if (e.total != null) body += ' · <strong>' + e.total + ' €</strong>';
    if (e.total_estimado != null) body += ' · est. ' + e.total_estimado + ' €';
    if (e.items && Array.isArray(e.items)) body += ' · ' + escapeHtml(e.items.join(', '));
    else if (e.items != null) body += ' · ' + e.items + ' items';
    if (e.propina) body += ' · propina ' + e.propina + ' €';
    return '<div class="tpv-event ' + (cls[e.type] || '') + '">'
      + '<div class="tpv-event-head">'
      + '<span class="tpv-event-type">' + (labels[e.type] || e.type) + '</span>'
      + '<span class="tpv-event-time">' + time + '</span></div>'
      + '<div class="tpv-event-body">' + body + '</div>'
      + '</div>';
  }).join('');
}

function diasRestantes(iso) {
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(iso + 'T00:00:00');
  return Math.round((d - t) / 86400000);
}

function renderHoy(root) {
  const today = budgets.filter(b => isToday(b.fechaEvento));
  const semana = budgets.filter(b => isThisWeek(b.fechaEvento) && !isToday(b.fechaEvento))
    .sort((a, b) => a.fechaEvento.localeCompare(b.fechaEvento));

  let html = '<div class="section-title">Hoy</div>';
  if (today.length === 0) {
    html += '<div class="empty"><div class="empty-icon">☕</div><div class="empty-text">Hoy no hay eventos.</div></div>';
  } else {
    html += today.map(eventCard).join('');
  }
  html += '<div class="section-title">Próximos 7 días</div>';
  if (semana.length === 0) {
    html += '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Sin eventos esta semana.</div></div>';
  } else {
    html += semana.map(eventCard).join('');
  }
  root.innerHTML = html;
}

function eventCard(b) {
  const dietas = b.dietas || {};
  const dietPills = renderDietPills(dietas);
  const cuandoBadge = isToday(b.fechaEvento)
    ? '<span class="ev-ref" style="background:rgba(52,211,153,.15);color:var(--accent);">HOY</span>'
    : '<span class="ev-ref">' + diasRestantes(b.fechaEvento) + 'd</span>';
  return `
    <article class="ev-card">
      <div class="ev-head">
        <div class="ev-title">${escapeHtml(b.clientName || 'Sin cliente')}</div>
        ${cuandoBadge}
      </div>
      <div style="font-size:13px;color:var(--text-soft);margin-bottom:6px;">${escapeHtml((b.eventType && b.eventType.name) || '')}</div>
      <div class="ev-meta">
        <div class="ev-meta-item"><div class="ev-meta-label">Fecha</div><div class="ev-meta-value">${escapeHtml(fmtDate(b.fechaEvento))}</div></div>
        <div class="ev-meta-item"><div class="ev-meta-label">Hora</div><div class="ev-meta-value">${escapeHtml(fmtTime(b.horaInicio))}</div></div>
        <div class="ev-meta-item"><div class="ev-meta-label">Espacio</div><div class="ev-meta-value">${escapeHtml(b.espacio || '—')}</div></div>
        <div class="ev-meta-item"><div class="ev-meta-label">Menú</div><div class="ev-meta-value">${escapeHtml((b.menuPkg && b.menuPkg.name) || '—')}</div></div>
      </div>
      <div class="ev-pax">
        <span class="ev-pax-icon">👥</span>
        <span><strong>${b.pt || 0}</strong> pax · ${b.pn || 0} normales + ${b.pi || 0} infantiles</span>
      </div>
      ${dietPills}
    </article>
  `;
}

function renderDietPills(dietas) {
  const map = {
    vegano:      { c: '#22c55e', l: '🌱 VEG' },
    vegetariano: { c: '#84cc16', l: '🥗 VG' },
    celiaco:     { c: '#ef4444', l: '🌾 CEL' },
    sinLactosa:  { c: '#3b82f6', l: '🥛 SL' },
    sinFrutos:   { c: '#f97316', l: '🌰 SF' },
    halal:       { c: '#8b5cf6', l: '🕌 HAL' },
    kosher:      { c: '#a78bfa', l: '✡️ KOS' },
  };
  const items = Object.entries(dietas).filter(([, n]) => n > 0);
  if (!items.length) return '';
  return '<div class="diet-row">' + items.map(([k, n]) => {
    const m = map[k] || { c: '#888', l: k };
    return '<span class="diet-pill" style="background:' + m.c + '20;color:' + m.c + ';border:1px solid ' + m.c + '40;">'
      + m.l + ' <span class="diet-count">' + n + '</span></span>';
  }).join('') + '</div>';
}

function renderDietas(root) {
  // Eventos próximos 30 días con dietas
  const t = new Date(); t.setHours(0,0,0,0);
  const limit = new Date(t); limit.setDate(limit.getDate() + 30);
  const eventos = budgets
    .filter(b => {
      if (!b.fechaEvento) return false;
      const d = new Date(b.fechaEvento + 'T00:00:00');
      if (d < t || d > limit) return false;
      const dietas = b.dietas || {};
      return Object.values(dietas).some(n => n > 0);
    })
    .sort((a,b) => a.fechaEvento.localeCompare(b.fechaEvento));

  // Tipos de dieta presentes en próximos 30 días
  const inst = projectData.dietas && projectData.dietas.instrucciones || {};
  const presente = new Set();
  eventos.forEach(e => Object.entries(e.dietas || {}).forEach(([k, n]) => { if (n > 0) presente.add(k); }));
  const sorted = [...presente].sort((a, b) => {
    // criticos primero (celiacos, frutos secos)
    const ord = { celiaco: 0, sinFrutos: 1, halal: 2, kosher: 3, sinLactosa: 4, vegano: 5, vegetariano: 6 };
    return (ord[a] ?? 99) - (ord[b] ?? 99);
  });

  let html = '<div class="section-title">Pulseras y protocolos · próximos 30 días</div>';
  if (!sorted.length) {
    html += '<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">Sin dietas especiales en los próximos 30 días.</div></div>';
  } else {
    html += sorted.map(k => {
      const i = inst[k] || {};
      return `
        <div class="crit-card" style="border-left-color:${i.color || '#888'};">
          <div class="crit-head">
            <div class="crit-name">${escapeHtml(i.label || k)}</div>
            <span class="crit-pulsera" style="background:${i.color || '#888'}25;color:${i.color || '#888'};">PULSERA</span>
          </div>
          <div class="crit-body">${escapeHtml(i.cocina || 'Sin protocolo definido')}</div>
          <dl class="crit-instr">
            ${i.sala     ? '<dt>Sala</dt><dd>' + escapeHtml(i.sala) + '</dd>' : ''}
            ${i.bebidas  ? '<dt>Bebidas</dt><dd>' + escapeHtml(i.bebidas) + '</dd>' : ''}
            ${i.pedido   ? '<dt>Pedido</dt><dd>' + escapeHtml(i.pedido) + '</dd>' : ''}
          </dl>
        </div>
      `;
    }).join('');
  }

  html += '<div class="section-title">Eventos con dietas próximos</div>';
  if (!eventos.length) {
    html += '<div class="empty-text" style="color:var(--text-muted);text-align:center;padding:20px;">—</div>';
  } else {
    html += eventos.slice(0, 10).map(eventCard).join('');
  }

  root.innerHTML = html;
}

function renderEspacios(root) {
  const occ = window.fnbMetrics.occupancyBySpace(budgets, 30);
  const espaciosMeta = (projectData.establecimiento && projectData.establecimiento.espacios) || [];
  const metaById = new Map(espaciosMeta.map(e => [e.id, e]));

  let html = '<div class="section-title">Ocupación próximos 30 días</div>';
  if (!occ.length) {
    html += '<div class="empty"><div class="empty-icon">🏛️</div><div class="empty-text">Sin eventos asignados a espacios.</div></div>';
  } else {
    html += occ.map(o => {
      const meta = metaById.get(o.espacio) || {};
      return `
        <div class="space-card">
          <div class="space-head">
            <div class="space-name">${escapeHtml(meta.nombre || o.espacio)}</div>
            <div class="space-pax"><strong>${o.count}</strong> eventos · ${o.paxTotal} pax</div>
          </div>
          ${meta.capacidad_sentado ? '<div style="font-size:12px;color:var(--text-muted);margin-top:4px;">Cap. sentado: ' + meta.capacidad_sentado + ' · cóctel: ' + (meta.capacidad_coctel || '—') + '</div>' : ''}
          <div class="space-progress"><div class="space-progress-fill" style="width:${o.percent}%"></div></div>
        </div>
      `;
    }).join('');
  }

  // Catálogo completo de espacios
  if (espaciosMeta.length) {
    html += '<div class="section-title">Catálogo de espacios</div>';
    html += espaciosMeta.map(e => `
      <div class="space-card">
        <div class="space-head">
          <div class="space-name">${escapeHtml(e.nombre)}</div>
          <div style="font-size:12px;color:var(--text-muted);">${e.superficie_m2 || '—'} m²</div>
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">
          Sentado: <strong style="color:var(--text);">${e.capacidad_sentado || '—'}</strong> ·
          Cóctel: <strong style="color:var(--text);">${e.capacidad_coctel || '—'}</strong>
        </div>
      </div>
    `).join('');
  }

  root.innerHTML = html;
}

// ── Service worker registration ─────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}

// ── i18n selector en topbar (v5.5) ──────
if (window.fnbI18n) {
  const slot = $('#i18nSlotSala');
  if (slot) window.fnbI18n.injectSelector(slot);
}

// ── Boot ────────────────────────────────
loadProjectsList();
loadAll();
</script>
</body>
</html>
