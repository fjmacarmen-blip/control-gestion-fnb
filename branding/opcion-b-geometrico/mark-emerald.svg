<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Plataforma F&amp;B">
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#gb)"/>
  <!-- Símbolo abstracto: 3 líneas horizontales tipo "menú servido" + acento vertical -->
  <!-- Las 3 horizontales simulan platos en mesa · la vertical es el flujo / temporización -->
  <g fill="#0d1117">
    <!-- Línea superior (entrantes) · más corta -->
    <rect x="124" y="160" width="200" height="22" rx="11"/>
    <!-- Línea central (principal) · más larga · acento -->
    <rect x="124" y="234" width="280" height="34" rx="17"/>
    <!-- Línea inferior (postre) · corta -->
    <rect x="124" y="320" width="160" height="22" rx="11"/>
    <!-- Acento vertical derecho · "flujo del servicio" -->
    <rect x="368" y="160" width="22" height="182" rx="11" opacity="0.85"/>
  </g>
</svg>
