<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Queens Bellybutton · Q con flor rosa y tallo de campanillas">
  <defs>
    <radialGradient id="bgH" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#172950"/>
      <stop offset="100%" stop-color="#0a1733"/>
    </radialGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8cf8a"/>
      <stop offset="48%" stop-color="#c9a35c"/>
      <stop offset="100%" stop-color="#8a682b"/>
    </linearGradient>
    <linearGradient id="goldThinH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8cf8a"/>
      <stop offset="100%" stop-color="#a87e35"/>
    </linearGradient>
    <linearGradient id="petalH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f5b0c2"/>
      <stop offset="55%" stop-color="#d97a98"/>
      <stop offset="100%" stop-color="#9c3f60"/>
    </linearGradient>
    <radialGradient id="centerH" cx="50%" cy="40%" r="55%">
      <stop offset="0%"  stop-color="#fde9a6"/>
      <stop offset="70%" stop-color="#d4a64a"/>
    </radialGradient>
    <linearGradient id="leafH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9eb274"/>
      <stop offset="100%" stop-color="#566935"/>
    </linearGradient>
    <linearGradient id="stemH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9caf6f"/>
      <stop offset="100%" stop-color="#5e6f3f"/>
    </linearGradient>
    <linearGradient id="bellH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="60%" stop-color="#f3e6b9"/>
      <stop offset="100%" stop-color="#d6b97a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="80" fill="url(#bgH)"/>

  <!-- Corona -->
  <g transform="translate(300 138)">
    <rect x="-58" y="14" width="116" height="11" rx="2" fill="url(#goldH)"/>
    <path d="M -58 16 L -38 -22 L -22 6 L 0 -34 L 22 6 L 38 -22 L 58 16 Z"
          fill="url(#goldH)" stroke="#8a682b" stroke-width="0.6"/>
    <circle cx="-38" cy="-22" r="4.5" fill="url(#goldH)"/>
    <circle cx="0"   cy="-34" r="5.5" fill="url(#goldH)"/>
    <circle cx="38"  cy="-22" r="4.5" fill="url(#goldH)"/>
  </g>

  <!-- Q monograma -->
  <text x="300" y="395"
        font-family="'Playfair Display','Cormorant Garamond',Georgia,serif"
        font-size="320" font-weight="500"
        text-anchor="middle" fill="url(#goldH)">Q</text>

  <!-- Izquierda · una flor rosa principal + 2 hojas redondas -->
  <g transform="translate(218 372)">
    <!-- Hoja redonda -->
    <g transform="translate(-30 16) rotate(-15)">
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="url(#leafH)" opacity="0.92"/>
      <circle cx="0" cy="0" r="3" fill="#3e4a26" opacity="0.55"/>
    </g>
    <!-- Hoja redonda más pequeña -->
    <g transform="translate(-44 -8) rotate(10)">
      <ellipse cx="0" cy="0" rx="13" ry="9" fill="url(#leafH)" opacity="0.85"/>
      <circle cx="0" cy="0" r="2.4" fill="#3e4a26" opacity="0.5"/>
    </g>

    <!-- Flor rosa grande -->
    <g>
      <g>
        <g><path d="M 0 -22 Q -5 -12 0 -2 Q 5 -12 0 -22 Z" fill="url(#petalH)" stroke="#7a2e4a" stroke-width="0.4"/></g>
        <g transform="rotate(36)"><path d="M 0 -22 Q -5 -12 0 -2 Q 5 -12 0 -22 Z" fill="url(#petalH)" stroke="#7a2e4a" stroke-width="0.4"/></g>
        <g transform="rotate(72)"><path d="M 0 -22 Q -5 -12 0 -2 Q 5 -12 0 -22 Z" fill="url(#petalH)" stroke="#7a2e4a" stroke-width="0.4"/></g>
        <g transform="rotate(108)"><path d="M 0 -22 Q -5 -12 0 -2 Q 5 -12 0 -22 Z" fill="url(#petalH)" stroke="#7a2e4a" stroke-width="0.4"/></g>
        <g transform="rotate(144)"><path d="M 0 -22 Q -5 -12 0 -2 Q 5 -12 0 -22 Z" fill="url(#petalH)" stroke="#7a2e4a" stroke-width="0.4"/></g>
        <g transform="rotate(180)"><path d="M 0 -22 Q -5 -12 0 -2 Q 5 -12 0 -22 Z" fill="url(#petalH)" stroke="#7a2e4a" stroke-width="0.4"/></g>
        <g transform="rotate(216)"><path d="M 0 -22 Q -5 -12 0 -2 Q 5 -12 0 -22 Z" fill="url(#petalH)" stroke="#7a2e4a" stroke-width="0.4"/></g>
        <g transform="rotate(252)"><path d="M 0 -22 Q -5 -12 0 -2 Q 5 -12 0 -22 Z" fill="url(#petalH)" stroke="#7a2e4a" stroke-width="0.4"/></g>
        <g transform="rotate(288)"><path d="M 0 -22 Q -5 -12 0 -2 Q 5 -12 0 -22 Z" fill="url(#petalH)" stroke="#7a2e4a" stroke-width="0.4"/></g>
        <g transform="rotate(324)"><path d="M 0 -22 Q -5 -12 0 -2 Q 5 -12 0 -22 Z" fill="url(#petalH)" stroke="#7a2e4a" stroke-width="0.4"/></g>
      </g>
      <!-- Capa interior -->
      <g transform="rotate(18)" opacity="0.92">
        <g><path d="M 0 -13 Q -3 -7 0 -1 Q 3 -7 0 -13 Z" fill="#e692a8" stroke="#7a2e4a" stroke-width="0.3"/></g>
        <g transform="rotate(60)"><path d="M 0 -13 Q -3 -7 0 -1 Q 3 -7 0 -13 Z" fill="#e692a8" stroke="#7a2e4a" stroke-width="0.3"/></g>
        <g transform="rotate(120)"><path d="M 0 -13 Q -3 -7 0 -1 Q 3 -7 0 -13 Z" fill="#e692a8" stroke="#7a2e4a" stroke-width="0.3"/></g>
        <g transform="rotate(180)"><path d="M 0 -13 Q -3 -7 0 -1 Q 3 -7 0 -13 Z" fill="#e692a8" stroke="#7a2e4a" stroke-width="0.3"/></g>
        <g transform="rotate(240)"><path d="M 0 -13 Q -3 -7 0 -1 Q 3 -7 0 -13 Z" fill="#e692a8" stroke="#7a2e4a" stroke-width="0.3"/></g>
        <g transform="rotate(300)"><path d="M 0 -13 Q -3 -7 0 -1 Q 3 -7 0 -13 Z" fill="#e692a8" stroke="#7a2e4a" stroke-width="0.3"/></g>
      </g>
      <circle cx="0" cy="0" r="6.5" fill="url(#centerH)" stroke="#7a5418" stroke-width="0.5"/>
      <circle cx="-1.5" cy="-1.5" r="2" fill="#fde9a6" opacity="0.7"/>
    </g>
  </g>

  <!-- Derecha · espiga florida con campanillas blancas (Umbilicus botánicamente real) -->
  <g transform="translate(395 380)">
    <path d="M 0 0 Q 6 -40 12 -84 Q 18 -130 22 -174"
          fill="none" stroke="url(#stemH)" stroke-width="2.4" stroke-linecap="round"/>
    <g stroke="#a87e35" stroke-width="0.5">
      <path d="M -3 -22 l -8 4" stroke="url(#stemH)" stroke-width="1"/>
      <path d="M -10 -18 q -3 5 -1 10 q 4 2 6 -1 q 1 -6 -1 -10 q -2 -1 -4 1 z" fill="url(#bellH)"/>
      <path d="M 8 -42 l 8 -3" stroke="url(#stemH)" stroke-width="1"/>
      <path d="M 17 -40 q -3 5 -1 10 q 4 2 6 -1 q 1 -6 -1 -10 q -2 -1 -4 1 z" fill="url(#bellH)"/>
      <path d="M 3 -64 l -8 4" stroke="url(#stemH)" stroke-width="1"/>
      <path d="M -5 -60 q -3 5 -1 10 q 4 2 6 -1 q 1 -6 -1 -10 q -2 -1 -4 1 z" fill="url(#bellH)"/>
      <path d="M 14 -88 l 8 -3" stroke="url(#stemH)" stroke-width="1"/>
      <path d="M 22 -86 q -3 5 -1 10 q 4 2 6 -1 q 1 -6 -1 -10 q -2 -1 -4 1 z" fill="url(#bellH)"/>
      <path d="M 8 -110 l -8 4" stroke="url(#stemH)" stroke-width="1"/>
      <path d="M -1 -106 q -3 5 -1 10 q 4 2 6 -1 q 1 -6 -1 -10 q -2 -1 -4 1 z" fill="url(#bellH)"/>
      <path d="M 18 -134 l 8 -3" stroke="url(#stemH)" stroke-width="1"/>
      <path d="M 26 -132 q -3 5 -1 10 q 4 2 6 -1 q 1 -6 -1 -10 q -2 -1 -4 1 z" fill="url(#bellH)"/>
    </g>
    <ellipse cx="22" cy="-174" rx="2.2" ry="4" fill="url(#bellH)" stroke="#a87e35" stroke-width="0.5"/>
  </g>

  <line x1="220" y1="448" x2="380" y2="448" stroke="url(#goldThinH)" stroke-width="0.8"/>

  <g font-family="'Cinzel','Cormorant Garamond',Georgia,serif" text-anchor="middle">
    <text x="300" y="490" font-size="36" font-weight="500"
          fill="url(#goldH)" letter-spacing="6">QUEENS</text>
  </g>
  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle">
    <text x="300" y="520" font-size="13" font-weight="500"
          fill="#e8e6df" letter-spacing="6">BELLY BUTTON</text>
    <text x="300" y="548" font-size="9" font-weight="500"
          fill="#8aa5d6" letter-spacing="3.5">HOSPITALITY MANAGEMENT SOFTWARE</text>
  </g>
</svg>
