<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Queens Bellybutton · horizontal abrazo">
  <defs>
    <linearGradient id="bgEH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1c3f"/>
      <stop offset="100%" stop-color="#0a1733"/>
    </linearGradient>
    <linearGradient id="goldEH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8cf8a"/>
      <stop offset="48%" stop-color="#c9a35c"/>
      <stop offset="100%" stop-color="#8a682b"/>
    </linearGradient>
    <linearGradient id="stemEH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9caf6f"/>
      <stop offset="100%" stop-color="#5e6f3f"/>
    </linearGradient>
    <linearGradient id="bellEH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="60%" stop-color="#f3e6b9"/>
      <stop offset="100%" stop-color="#d6b97a"/>
    </linearGradient>
    <linearGradient id="bellPinkEH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="60%" stop-color="#f0d4ce"/>
      <stop offset="100%" stop-color="#c98a8a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="280" fill="url(#bgEH)"/>

  <g transform="translate(140 158)">
    <g transform="translate(0 -98)">
      <rect x="-32" y="8" width="64" height="6" rx="1.5" fill="url(#goldEH)"/>
      <path d="M -32 9 L -21 -12 L -12 4 L 0 -19 L 12 4 L 21 -12 L 32 9 Z" fill="url(#goldEH)"/>
      <circle cx="-21" cy="-12" r="2.5" fill="url(#goldEH)"/>
      <circle cx="0"   cy="-19" r="3"   fill="url(#goldEH)"/>
      <circle cx="21"  cy="-12" r="2.5" fill="url(#goldEH)"/>
    </g>
    <text x="0" y="42"
          font-family="'Playfair Display','Cormorant Garamond',Georgia,serif"
          font-size="200" font-weight="500"
          text-anchor="middle" fill="url(#goldEH)">Q</text>
    <!-- Tallo curvo abrazo escalado -->
    <g>
      <ellipse cx="-58" cy="38" rx="8" ry="5.5" fill="url(#stemEH)" opacity="0.92"/>
      <path d="M -58 33
               C -60 14 -64 -10 -70 -32
               C -74 -48 -76 -58 -78 -68"
            fill="none" stroke="url(#stemEH)" stroke-width="1.6" stroke-linecap="round"/>
      <g stroke="#a87e35" stroke-width="0.4">
        <path d="M -64 16 q -2 4 -0.5 7.5 q 3 1.5 5 -1 q 1 -5 -1 -7.5 q -2 -1 -3.5 1 z" fill="url(#bellEH)"/>
        <path d="M -64 -2 q -2 4 -0.5 7.5 q 3 1.5 5 -1 q 1 -5 -1 -7.5 q -2 -1 -3.5 1 z" fill="url(#bellPinkEH)"/>
        <path d="M -71 -22 q -2 4 -0.5 7.5 q 3 1.5 5 -1 q 1 -5 -1 -7.5 q -2 -1 -3.5 1 z" fill="url(#bellEH)"/>
        <path d="M -71 -46 q -2 4 -0.5 7.5 q 3 1.5 5 -1 q 1 -5 -1 -7.5 q -2 -1 -3.5 1 z" fill="url(#bellPinkEH)"/>
      </g>
      <ellipse cx="-78" cy="-68" rx="1.4" ry="2.6" fill="url(#bellEH)" stroke="#a87e35" stroke-width="0.4"/>
    </g>
  </g>

  <g transform="translate(310 0)">
    <text x="0" y="130"
          font-family="'Cinzel','Cormorant Garamond',Georgia,serif"
          font-size="56" font-weight="500"
          fill="url(#goldEH)" letter-spacing="9">QUEENS</text>
    <line x1="0" y1="148" x2="240" y2="148" stroke="#c9a35c" stroke-width="0.8" opacity="0.7"/>
    <text x="0" y="174"
          font-family="Inter,system-ui,sans-serif"
          font-size="16" font-weight="500"
          fill="#e8e6df" letter-spacing="9">BELLY BUTTON</text>
    <text x="0" y="200"
          font-family="Inter,system-ui,sans-serif"
          font-size="10.5" font-weight="500"
          fill="#8aa5d6" letter-spacing="4.5">HOSPITALITY MANAGEMENT SOFTWARE</text>
  </g>
</svg>
