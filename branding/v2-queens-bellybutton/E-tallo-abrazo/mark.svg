<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Queens Bellybutton · Q abrazada por tallo florido">
  <defs>
    <radialGradient id="bgE" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#172950"/>
      <stop offset="100%" stop-color="#0a1733"/>
    </radialGradient>
    <linearGradient id="goldE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8cf8a"/>
      <stop offset="48%" stop-color="#c9a35c"/>
      <stop offset="100%" stop-color="#8a682b"/>
    </linearGradient>
    <linearGradient id="stemE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9caf6f"/>
      <stop offset="100%" stop-color="#5e6f3f"/>
    </linearGradient>
    <linearGradient id="bellE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="60%" stop-color="#f3e6b9"/>
      <stop offset="100%" stop-color="#d6b97a"/>
    </linearGradient>
    <!-- Variante con leve rosado para algunas flores · diferenciación visual interna -->
    <linearGradient id="bellPinkE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="60%" stop-color="#f0d4ce"/>
      <stop offset="100%" stop-color="#c98a8a"/>
    </linearGradient>
    <linearGradient id="goldThinE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8cf8a"/>
      <stop offset="100%" stop-color="#a87e35"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="80" fill="url(#bgE)"/>

  <!-- Corona -->
  <g transform="translate(300 138)">
    <rect x="-58" y="14" width="116" height="11" rx="2" fill="url(#goldE)"/>
    <path d="M -58 16 L -38 -22 L -22 6 L 0 -34 L 22 6 L 38 -22 L 58 16 Z"
          fill="url(#goldE)" stroke="#8a682b" stroke-width="0.6"/>
    <circle cx="-38" cy="-22" r="4.5" fill="url(#goldE)"/>
    <circle cx="0"   cy="-34" r="5.5" fill="url(#goldE)"/>
    <circle cx="38"  cy="-22" r="4.5" fill="url(#goldE)"/>
  </g>

  <!-- Q monograma · misma posición -->
  <text x="300" y="395"
        font-family="'Playfair Display','Cormorant Garamond',Georgia,serif"
        font-size="320" font-weight="500"
        text-anchor="middle" fill="url(#goldE)">Q</text>

  <!-- Tallo florido que abraza la Q por la izquierda · sube desde abajo y se curva hacia arriba
       6 flores colgantes distribuidas en la curva, alternando blanco-marfil y blanco-rosado -->
  <g>
    <!-- Hoja suculenta basal redonda (el "ombligo" botánico) -->
    <ellipse cx="178" cy="394" rx="14" ry="10" fill="url(#stemE)" opacity="0.92"/>
    <circle cx="178" cy="394" r="3.5" fill="#3e4a26" opacity="0.6"/>

    <!-- Tallo curvo: sube por la izquierda de la Q, asoma por la parte superior izquierda -->
    <path d="M 178 388
             C 175 340 168 290 156 240
             C 148 210 142 188 138 168"
          fill="none" stroke="url(#stemE)" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Pedicelos + campanillas a lo largo del tallo -->
    <!-- Flor 1 (abajo, mayor) -->
    <path d="M 173 360 l -10 6" stroke="url(#stemE)" stroke-width="1"/>
    <path d="M 162 364 q -4 7 -2 13 q 5 3 8 -1 q 2 -8 -1 -13 q -3 -1 -5 1 z" fill="url(#bellE)" stroke="#a87e35" stroke-width="0.5"/>

    <!-- Flor 2 -->
    <path d="M 168 326 l 9 -3" stroke="url(#stemE)" stroke-width="1"/>
    <path d="M 176 322 q -3 6 -1 11 q 4 2 7 -1 q 1 -7 -1 -11 q -3 -1 -5 1 z" fill="url(#bellPinkE)" stroke="#a87e35" stroke-width="0.5"/>

    <!-- Flor 3 -->
    <path d="M 161 288 l -10 5" stroke="url(#stemE)" stroke-width="1"/>
    <path d="M 150 290 q -3 6 -1 11 q 4 2 7 -1 q 1 -7 -1 -11 q -3 -1 -5 1 z" fill="url(#bellE)" stroke="#a87e35" stroke-width="0.5"/>

    <!-- Flor 4 -->
    <path d="M 155 252 l 9 -3" stroke="url(#stemE)" stroke-width="1"/>
    <path d="M 163 248 q -3 6 -1 11 q 4 2 7 -1 q 1 -7 -1 -11 q -3 -1 -5 1 z" fill="url(#bellPinkE)" stroke="#a87e35" stroke-width="0.5"/>

    <!-- Flor 5 -->
    <path d="M 148 216 l -10 4" stroke="url(#stemE)" stroke-width="1"/>
    <path d="M 137 217 q -3 5 -1 10 q 4 2 7 -1 q 1 -6 -1 -10 q -3 -1 -5 1 z" fill="url(#bellE)" stroke="#a87e35" stroke-width="0.5"/>

    <!-- Flor 6 superior (más pequeña, en el ápice de la curva) -->
    <path d="M 142 188 l 8 -3" stroke="url(#stemE)" stroke-width="1"/>
    <path d="M 149 184 q -2 5 -0.5 9 q 3 1.5 5 -1 q 1 -5 -1 -9 q -2 -1 -3.5 1 z" fill="url(#bellE)" stroke="#a87e35" stroke-width="0.5"/>

    <!-- Brote sin abrir en el extremo del tallo -->
    <ellipse cx="138" cy="168" rx="2" ry="3.6" fill="url(#bellE)" stroke="#a87e35" stroke-width="0.4"/>
  </g>

  <line x1="220" y1="448" x2="380" y2="448" stroke="url(#goldThinE)" stroke-width="0.8"/>

  <g font-family="'Cinzel','Cormorant Garamond',Georgia,serif" text-anchor="middle">
    <text x="300" y="490" font-size="36" font-weight="500"
          fill="url(#goldE)" letter-spacing="6">QUEENS</text>
  </g>
  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle">
    <text x="300" y="520" font-size="13" font-weight="500"
          fill="#e8e6df" letter-spacing="6">BELLY BUTTON</text>
    <text x="300" y="548" font-size="9" font-weight="500"
          fill="#8aa5d6" letter-spacing="3.5">HOSPITALITY MANAGEMENT SOFTWARE</text>
  </g>
</svg>
