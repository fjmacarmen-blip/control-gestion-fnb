<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Queens Bellybutton · Q con racimo de 3 flores rosas">
  <defs>
    <radialGradient id="bgI" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#172950"/>
      <stop offset="100%" stop-color="#0a1733"/>
    </radialGradient>
    <linearGradient id="goldI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8cf8a"/>
      <stop offset="48%" stop-color="#c9a35c"/>
      <stop offset="100%" stop-color="#8a682b"/>
    </linearGradient>
    <linearGradient id="goldThinI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8cf8a"/>
      <stop offset="100%" stop-color="#a87e35"/>
    </linearGradient>
    <linearGradient id="petalI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f5b0c2"/>
      <stop offset="55%" stop-color="#d97a98"/>
      <stop offset="100%" stop-color="#9c3f60"/>
    </linearGradient>
    <linearGradient id="petalIsoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fbdde6"/>
      <stop offset="60%" stop-color="#eaa0b6"/>
      <stop offset="100%" stop-color="#a05872"/>
    </linearGradient>
    <radialGradient id="centerI" cx="50%" cy="40%" r="55%">
      <stop offset="0%"  stop-color="#fde9a6"/>
      <stop offset="70%" stop-color="#d4a64a"/>
    </radialGradient>
    <linearGradient id="leafI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9eb274"/>
      <stop offset="100%" stop-color="#566935"/>
    </linearGradient>
    <linearGradient id="stemI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9caf6f"/>
      <stop offset="100%" stop-color="#5e6f3f"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="80" fill="url(#bgI)"/>

  <!-- Corona -->
  <g transform="translate(300 138)">
    <rect x="-58" y="14" width="116" height="11" rx="2" fill="url(#goldI)"/>
    <path d="M -58 16 L -38 -22 L -22 6 L 0 -34 L 22 6 L 38 -22 L 58 16 Z"
          fill="url(#goldI)" stroke="#8a682b" stroke-width="0.6"/>
    <circle cx="-38" cy="-22" r="4.5" fill="url(#goldI)"/>
    <circle cx="0"   cy="-34" r="5.5" fill="url(#goldI)"/>
    <circle cx="38"  cy="-22" r="4.5" fill="url(#goldI)"/>
  </g>

  <!-- Q monograma -->
  <text x="300" y="395"
        font-family="'Playfair Display','Cormorant Garamond',Georgia,serif"
        font-size="320" font-weight="500"
        text-anchor="middle" fill="url(#goldI)">Q</text>

  <!-- Tallo común que conecta el racimo · sube por la derecha de la Q hasta arriba-derecha -->
  <path d="M 400 380 Q 410 320 408 260 Q 405 220 398 180"
        fill="none" stroke="url(#stemI)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- 3 hojas redondas en la base del racimo -->
  <g transform="translate(395 388)">
    <ellipse cx="0" cy="0" rx="15" ry="10" fill="url(#leafI)" opacity="0.92"/>
    <circle cx="0" cy="0" r="2.8" fill="#3e4a26" opacity="0.55"/>
    <ellipse cx="-14" cy="8" rx="11" ry="7" fill="url(#leafI)" opacity="0.82"/>
    <ellipse cx="14" cy="6" rx="10" ry="7" fill="url(#leafI)" opacity="0.75"/>
  </g>

  <!-- Flor 1 · pequeña, abajo (rosa pálido) -->
  <g transform="translate(412 320)">
    <g>
      <g><path d="M 0 -10 Q -2 -5 0 -1 Q 2 -5 0 -10 Z" fill="url(#petalIsoft)" stroke="#7a2e4a" stroke-width="0.3"/></g>
      <g transform="rotate(45)"><path d="M 0 -10 Q -2 -5 0 -1 Q 2 -5 0 -10 Z" fill="url(#petalIsoft)" stroke="#7a2e4a" stroke-width="0.3"/></g>
      <g transform="rotate(90)"><path d="M 0 -10 Q -2 -5 0 -1 Q 2 -5 0 -10 Z" fill="url(#petalIsoft)" stroke="#7a2e4a" stroke-width="0.3"/></g>
      <g transform="rotate(135)"><path d="M 0 -10 Q -2 -5 0 -1 Q 2 -5 0 -10 Z" fill="url(#petalIsoft)" stroke="#7a2e4a" stroke-width="0.3"/></g>
      <g transform="rotate(180)"><path d="M 0 -10 Q -2 -5 0 -1 Q 2 -5 0 -10 Z" fill="url(#petalIsoft)" stroke="#7a2e4a" stroke-width="0.3"/></g>
      <g transform="rotate(225)"><path d="M 0 -10 Q -2 -5 0 -1 Q 2 -5 0 -10 Z" fill="url(#petalIsoft)" stroke="#7a2e4a" stroke-width="0.3"/></g>
      <g transform="rotate(270)"><path d="M 0 -10 Q -2 -5 0 -1 Q 2 -5 0 -10 Z" fill="url(#petalIsoft)" stroke="#7a2e4a" stroke-width="0.3"/></g>
      <g transform="rotate(315)"><path d="M 0 -10 Q -2 -5 0 -1 Q 2 -5 0 -10 Z" fill="url(#petalIsoft)" stroke="#7a2e4a" stroke-width="0.3"/></g>
    </g>
    <circle cx="0" cy="0" r="3.5" fill="url(#centerI)"/>
  </g>

  <!-- Flor 2 · mediana, central derecha (rosa intenso) -->
  <g transform="translate(420 260)">
    <g>
      <g><path d="M 0 -16 Q -3 -8 0 -1 Q 3 -8 0 -16 Z" fill="url(#petalI)" stroke="#7a2e4a" stroke-width="0.35"/></g>
      <g transform="rotate(36)"><path d="M 0 -16 Q -3 -8 0 -1 Q 3 -8 0 -16 Z" fill="url(#petalI)" stroke="#7a2e4a" stroke-width="0.35"/></g>
      <g transform="rotate(72)"><path d="M 0 -16 Q -3 -8 0 -1 Q 3 -8 0 -16 Z" fill="url(#petalI)" stroke="#7a2e4a" stroke-width="0.35"/></g>
      <g transform="rotate(108)"><path d="M 0 -16 Q -3 -8 0 -1 Q 3 -8 0 -16 Z" fill="url(#petalI)" stroke="#7a2e4a" stroke-width="0.35"/></g>
      <g transform="rotate(144)"><path d="M 0 -16 Q -3 -8 0 -1 Q 3 -8 0 -16 Z" fill="url(#petalI)" stroke="#7a2e4a" stroke-width="0.35"/></g>
      <g transform="rotate(180)"><path d="M 0 -16 Q -3 -8 0 -1 Q 3 -8 0 -16 Z" fill="url(#petalI)" stroke="#7a2e4a" stroke-width="0.35"/></g>
      <g transform="rotate(216)"><path d="M 0 -16 Q -3 -8 0 -1 Q 3 -8 0 -16 Z" fill="url(#petalI)" stroke="#7a2e4a" stroke-width="0.35"/></g>
      <g transform="rotate(252)"><path d="M 0 -16 Q -3 -8 0 -1 Q 3 -8 0 -16 Z" fill="url(#petalI)" stroke="#7a2e4a" stroke-width="0.35"/></g>
      <g transform="rotate(288)"><path d="M 0 -16 Q -3 -8 0 -1 Q 3 -8 0 -16 Z" fill="url(#petalI)" stroke="#7a2e4a" stroke-width="0.35"/></g>
      <g transform="rotate(324)"><path d="M 0 -16 Q -3 -8 0 -1 Q 3 -8 0 -16 Z" fill="url(#petalI)" stroke="#7a2e4a" stroke-width="0.35"/></g>
    </g>
    <circle cx="0" cy="0" r="5" fill="url(#centerI)" stroke="#7a5418" stroke-width="0.4"/>
  </g>

  <!-- Flor 3 · pequeña arriba (capullo entreabierto, rosa pálido) -->
  <g transform="translate(402 200)">
    <g>
      <g><path d="M 0 -8 Q -2 -4 0 -1 Q 2 -4 0 -8 Z" fill="url(#petalIsoft)" stroke="#7a2e4a" stroke-width="0.3"/></g>
      <g transform="rotate(60)"><path d="M 0 -8 Q -2 -4 0 -1 Q 2 -4 0 -8 Z" fill="url(#petalIsoft)" stroke="#7a2e4a" stroke-width="0.3"/></g>
      <g transform="rotate(120)"><path d="M 0 -8 Q -2 -4 0 -1 Q 2 -4 0 -8 Z" fill="url(#petalIsoft)" stroke="#7a2e4a" stroke-width="0.3"/></g>
      <g transform="rotate(180)"><path d="M 0 -8 Q -2 -4 0 -1 Q 2 -4 0 -8 Z" fill="url(#petalIsoft)" stroke="#7a2e4a" stroke-width="0.3"/></g>
      <g transform="rotate(240)"><path d="M 0 -8 Q -2 -4 0 -1 Q 2 -4 0 -8 Z" fill="url(#petalIsoft)" stroke="#7a2e4a" stroke-width="0.3"/></g>
      <g transform="rotate(300)"><path d="M 0 -8 Q -2 -4 0 -1 Q 2 -4 0 -8 Z" fill="url(#petalIsoft)" stroke="#7a2e4a" stroke-width="0.3"/></g>
    </g>
    <circle cx="0" cy="0" r="2.5" fill="url(#centerI)"/>
  </g>

  <!-- Capullo cerrado en el extremo del tallo (sugiere que floracerá más) -->
  <ellipse cx="398" cy="180" rx="3" ry="5" fill="url(#petalIsoft)" stroke="#7a2e4a" stroke-width="0.4"/>

  <line x1="220" y1="448" x2="380" y2="448" stroke="url(#goldThinI)" stroke-width="0.8"/>

  <g font-family="'Cinzel','Cormorant Garamond',Georgia,serif" text-anchor="middle">
    <text x="300" y="490" font-size="36" font-weight="500"
          fill="url(#goldI)" letter-spacing="6">QUEENS</text>
  </g>
  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle">
    <text x="300" y="520" font-size="13" font-weight="500"
          fill="#e8e6df" letter-spacing="6">BELLY BUTTON</text>
    <text x="300" y="548" font-size="9" font-weight="500"
          fill="#8aa5d6" letter-spacing="3.5">HOSPITALITY MANAGEMENT SOFTWARE</text>
  </g>
</svg>
