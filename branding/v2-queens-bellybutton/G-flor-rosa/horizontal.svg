<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Queens Bellybutton · horizontal G">
  <defs>
    <linearGradient id="bgGH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1c3f"/>
      <stop offset="100%" stop-color="#0a1733"/>
    </linearGradient>
    <linearGradient id="goldGH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8cf8a"/>
      <stop offset="48%" stop-color="#c9a35c"/>
      <stop offset="100%" stop-color="#8a682b"/>
    </linearGradient>
    <linearGradient id="petalGH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f5b0c2"/>
      <stop offset="55%" stop-color="#d97a98"/>
      <stop offset="100%" stop-color="#9c3f60"/>
    </linearGradient>
    <radialGradient id="centerGH" cx="50%" cy="40%" r="55%">
      <stop offset="0%"  stop-color="#fde9a6"/>
      <stop offset="70%" stop-color="#d4a64a"/>
    </radialGradient>
    <linearGradient id="leafGH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9eb274"/>
      <stop offset="100%" stop-color="#566935"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="280" fill="url(#bgGH)"/>

  <g transform="translate(140 158)">
    <g transform="translate(0 -98)">
      <rect x="-32" y="8" width="64" height="6" rx="1.5" fill="url(#goldGH)"/>
      <path d="M -32 9 L -21 -12 L -12 4 L 0 -19 L 12 4 L 21 -12 L 32 9 Z" fill="url(#goldGH)"/>
      <circle cx="-21" cy="-12" r="2.5" fill="url(#goldGH)"/>
      <circle cx="0"   cy="-19" r="3"   fill="url(#goldGH)"/>
      <circle cx="21"  cy="-12" r="2.5" fill="url(#goldGH)"/>
    </g>
    <text x="0" y="42"
          font-family="'Playfair Display','Cormorant Garamond',Georgia,serif"
          font-size="200" font-weight="500"
          text-anchor="middle" fill="url(#goldGH)">Q</text>

    <!-- Hojas izquierda -->
    <g transform="translate(-58 28)">
      <ellipse cx="0" cy="0" rx="13" ry="9" fill="url(#leafGH)"/>
      <circle cx="0" cy="0" r="2.2" fill="#3e4a26" opacity="0.55"/>
      <ellipse cx="-17" cy="-7" rx="10" ry="6.5" fill="url(#leafGH)" opacity="0.85"/>
    </g>

    <!-- Flor derecha -->
    <g transform="translate(54 18)">
      <g>
        <g><path d="M 0 -14 Q -3 -7 0 -1 Q 3 -7 0 -14 Z" fill="url(#petalGH)" stroke="#7a2e4a" stroke-width="0.3"/></g>
        <g transform="rotate(45)"><path d="M 0 -14 Q -3 -7 0 -1 Q 3 -7 0 -14 Z" fill="url(#petalGH)" stroke="#7a2e4a" stroke-width="0.3"/></g>
        <g transform="rotate(90)"><path d="M 0 -14 Q -3 -7 0 -1 Q 3 -7 0 -14 Z" fill="url(#petalGH)" stroke="#7a2e4a" stroke-width="0.3"/></g>
        <g transform="rotate(135)"><path d="M 0 -14 Q -3 -7 0 -1 Q 3 -7 0 -14 Z" fill="url(#petalGH)" stroke="#7a2e4a" stroke-width="0.3"/></g>
        <g transform="rotate(180)"><path d="M 0 -14 Q -3 -7 0 -1 Q 3 -7 0 -14 Z" fill="url(#petalGH)" stroke="#7a2e4a" stroke-width="0.3"/></g>
        <g transform="rotate(225)"><path d="M 0 -14 Q -3 -7 0 -1 Q 3 -7 0 -14 Z" fill="url(#petalGH)" stroke="#7a2e4a" stroke-width="0.3"/></g>
        <g transform="rotate(270)"><path d="M 0 -14 Q -3 -7 0 -1 Q 3 -7 0 -14 Z" fill="url(#petalGH)" stroke="#7a2e4a" stroke-width="0.3"/></g>
        <g transform="rotate(315)"><path d="M 0 -14 Q -3 -7 0 -1 Q 3 -7 0 -14 Z" fill="url(#petalGH)" stroke="#7a2e4a" stroke-width="0.3"/></g>
      </g>
      <circle cx="0" cy="0" r="4.5" fill="url(#centerGH)" stroke="#7a5418" stroke-width="0.4"/>
    </g>
  </g>

  <g transform="translate(310 0)">
    <text x="0" y="130"
          font-family="'Cinzel','Cormorant Garamond',Georgia,serif"
          font-size="56" font-weight="500"
          fill="url(#goldGH)" letter-spacing="9">QUEENS</text>
    <line x1="0" y1="148" x2="240" y2="148" stroke="#c9a35c" stroke-width="0.8" opacity="0.7"/>
    <text x="0" y="174"
          font-family="Inter,system-ui,sans-serif"
          font-size="16" font-weight="500"
          fill="#e8e6df" letter-spacing="9">BELLY BUTTON</text>
    <text x="0" y="200"
          font-family="Inter,system-ui,sans-serif"
          font-size="10.5" font-weight="500"
          fill="#8aa5d6" letter-spacing="4.5">HOSPITALITY MANAGEMENT SOFTWARE</text>
  </g>
</svg>
