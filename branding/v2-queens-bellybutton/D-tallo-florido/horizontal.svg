<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Queens Bellybutton · horizontal con tallo florido">
  <defs>
    <linearGradient id="bgDH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1c3f"/>
      <stop offset="100%" stop-color="#0a1733"/>
    </linearGradient>
    <linearGradient id="goldDH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8cf8a"/>
      <stop offset="48%" stop-color="#c9a35c"/>
      <stop offset="100%" stop-color="#8a682b"/>
    </linearGradient>
    <linearGradient id="stemDH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9caf6f"/>
      <stop offset="100%" stop-color="#5e6f3f"/>
    </linearGradient>
    <linearGradient id="bellDH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="60%" stop-color="#f3e6b9"/>
      <stop offset="100%" stop-color="#d6b97a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="280" fill="url(#bgDH)"/>

  <g transform="translate(140 158)">
    <g transform="translate(0 -98)">
      <rect x="-32" y="8" width="64" height="6" rx="1.5" fill="url(#goldDH)"/>
      <path d="M -32 9 L -21 -12 L -12 4 L 0 -19 L 12 4 L 21 -12 L 32 9 Z" fill="url(#goldDH)"/>
      <circle cx="-21" cy="-12" r="2.5" fill="url(#goldDH)"/>
      <circle cx="0"   cy="-19" r="3"   fill="url(#goldDH)"/>
      <circle cx="21"  cy="-12" r="2.5" fill="url(#goldDH)"/>
    </g>
    <text x="0" y="42"
          font-family="'Playfair Display','Cormorant Garamond',Georgia,serif"
          font-size="200" font-weight="500"
          text-anchor="middle" fill="url(#goldDH)">Q</text>
    <!-- Espiga florida lateral derecha · escalada -->
    <g transform="translate(58 22)">
      <path d="M 0 0 Q 4 -22 8 -50 Q 12 -78 14 -106"
            fill="none" stroke="url(#stemDH)" stroke-width="1.6" stroke-linecap="round"/>
      <g stroke="#a87e35" stroke-width="0.4">
        <path d="M -3 -10 q -2 3 -0.5 6.5 q 2.5 1.2 4 -0.5 q 0.5 -4 -1 -6.5 q -1.5 -0.5 -2.5 0.5 z" fill="url(#bellDH)"/>
        <path d="M 11 -26 q -2 3 -0.5 6.5 q 2.5 1.2 4 -0.5 q 0.5 -4 -1 -6.5 q -1.5 -0.5 -2.5 0.5 z" fill="url(#bellDH)"/>
        <path d="M 1 -42  q -2 3 -0.5 6.5 q 2.5 1.2 4 -0.5 q 0.5 -4 -1 -6.5 q -1.5 -0.5 -2.5 0.5 z" fill="url(#bellDH)"/>
        <path d="M 14 -60 q -2 3 -0.5 6.5 q 2.5 1.2 4 -0.5 q 0.5 -4 -1 -6.5 q -1.5 -0.5 -2.5 0.5 z" fill="url(#bellDH)"/>
        <path d="M 4 -78  q -2 3 -0.5 6.5 q 2.5 1.2 4 -0.5 q 0.5 -4 -1 -6.5 q -1.5 -0.5 -2.5 0.5 z" fill="url(#bellDH)"/>
      </g>
      <ellipse cx="14" cy="-106" rx="1.4" ry="2.6" fill="url(#bellDH)" stroke="#a87e35" stroke-width="0.4"/>
    </g>
  </g>

  <g transform="translate(310 0)">
    <text x="0" y="130"
          font-family="'Cinzel','Cormorant Garamond',Georgia,serif"
          font-size="56" font-weight="500"
          fill="url(#goldDH)" letter-spacing="9">QUEENS</text>
    <line x1="0" y1="148" x2="240" y2="148" stroke="#c9a35c" stroke-width="0.8" opacity="0.7"/>
    <text x="0" y="174"
          font-family="Inter,system-ui,sans-serif"
          font-size="16" font-weight="500"
          fill="#e8e6df" letter-spacing="9">BELLY BUTTON</text>
    <text x="0" y="200"
          font-family="Inter,system-ui,sans-serif"
          font-size="10.5" font-weight="500"
          fill="#8aa5d6" letter-spacing="4.5">HOSPITALITY MANAGEMENT SOFTWARE</text>
  </g>
