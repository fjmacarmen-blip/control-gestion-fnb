<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Queens Bellybutton · horizontal ombligo">
  <defs>
    <linearGradient id="bgCH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1c3f"/>
      <stop offset="100%" stop-color="#0a1733"/>
    </linearGradient>
    <linearGradient id="goldCH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8cf8a"/>
      <stop offset="48%" stop-color="#c9a35c"/>
      <stop offset="100%" stop-color="#8a682b"/>
    </linearGradient>
    <radialGradient id="ombligoCH" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#f5e3ac"/>
      <stop offset="55%" stop-color="#c9a35c"/>
      <stop offset="100%" stop-color="#6f5220"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="280" fill="url(#bgCH)"/>

  <g transform="translate(140 158)">
    <g transform="translate(0 -98)">
      <rect x="-32" y="8" width="64" height="6" rx="1.5" fill="url(#goldCH)"/>
      <path d="M -32 9 L -21 -12 L -12 4 L 0 -19 L 12 4 L 21 -12 L 32 9 Z" fill="url(#goldCH)"/>
      <circle cx="-21" cy="-12" r="2.5" fill="url(#goldCH)"/>
      <circle cx="0"   cy="-19" r="3"   fill="url(#goldCH)"/>
      <circle cx="21"  cy="-12" r="2.5" fill="url(#goldCH)"/>
    </g>
    <text x="0" y="42"
          font-family="'Playfair Display','Cormorant Garamond',Georgia,serif"
          font-size="200" font-weight="500"
          text-anchor="middle" fill="url(#goldCH)">Q</text>
    <!-- Ombligo central proporcional al tamaño horizontal -->
    <circle cx="-2" cy="-18" r="9" fill="url(#ombligoCH)"/>
    <circle cx="-2" cy="-18" r="13" fill="none" stroke="#c9a35c" stroke-width="0.7" opacity="0.5"/>
  </g>

  <g transform="translate(310 0)">
    <text x="0" y="130"
          font-family="'Cinzel','Cormorant Garamond',Georgia,serif"
          font-size="56" font-weight="500"
          fill="url(#goldCH)" letter-spacing="9">QUEENS</text>
    <line x1="0" y1="148" x2="240" y2="148" stroke="#c9a35c" stroke-width="0.8" opacity="0.7"/>
    <text x="0" y="174"
          font-family="Inter,system-ui,sans-serif"
          font-size="16" font-weight="500"
          fill="#e8e6df" letter-spacing="9">BELLY BUTTON</text>
    <text x="0" y="200"
          font-family="Inter,system-ui,sans-serif"
          font-size="10.5" font-weight="500"
          fill="#8aa5d6" letter-spacing="4.5">HOSPITALITY MANAGEMENT SOFTWARE</text>
  </g>
</svg>
