<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Queens Bellybutton · monograma con botánica">
  <defs>
    <radialGradient id="bgB" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#172950"/>
      <stop offset="100%" stop-color="#0a1733"/>
    </radialGradient>
    <linearGradient id="goldB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8cf8a"/>
      <stop offset="48%" stop-color="#c9a35c"/>
      <stop offset="100%" stop-color="#8a682b"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3b87b"/>
      <stop offset="100%" stop-color="#5e6f3f"/>
    </linearGradient>
    <linearGradient id="goldThinB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8cf8a"/>
      <stop offset="100%" stop-color="#a87e35"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="80" fill="url(#bgB)"/>

  <!-- Corona idéntica a A para coherencia entre las 3 opciones -->
  <g transform="translate(300 138)">
    <rect x="-58" y="14" width="116" height="11" rx="2" fill="url(#goldB)"/>
    <path d="M -58 16 L -38 -22 L -22 6 L 0 -34 L 22 6 L 38 -22 L 58 16 Z"
          fill="url(#goldB)" stroke="#8a682b" stroke-width="0.6"/>
    <circle cx="-38" cy="-22" r="4.5" fill="url(#goldB)"/>
    <circle cx="0"   cy="-34" r="5.5" fill="url(#goldB)"/>
    <circle cx="38"  cy="-22" r="4.5" fill="url(#goldB)"/>
  </g>

  <!-- Q monograma -->
  <text x="300" y="395"
        font-family="'Playfair Display','Cormorant Garamond',Georgia,serif"
        font-size="320" font-weight="500"
        text-anchor="middle" fill="url(#goldB)">Q</text>

  <!-- Rama botánica · 3 hojas saliendo de la cola de la Q, hacia la izquierda
       Inspirada en Umbilicus rupestris (planta de muro de monasterio) -->
  <g transform="translate(245 380)" opacity="0.92">
    <!-- Tallo curvo -->
    <path d="M 0 0 Q -30 -20 -52 -38 Q -70 -52 -82 -42"
          fill="none" stroke="url(#leafB)" stroke-width="2" stroke-linecap="round"/>
    <!-- Hoja 1 (la más cercana a la Q, mediana) -->
    <path d="M -22 -16 Q -36 -32 -50 -22 Q -36 -8 -22 -16 Z" fill="url(#leafB)"/>
    <!-- Hoja 2 (intermedia, mayor) -->
    <path d="M -50 -34 Q -68 -52 -88 -38 Q -72 -22 -50 -34 Z" fill="url(#leafB)"/>
    <!-- Hoja 3 (pequeña, en la punta) -->
    <path d="M -78 -44 Q -90 -56 -98 -48 Q -90 -38 -78 -44 Z" fill="url(#leafB)"/>
    <!-- Nervaduras finas -->
    <path d="M -22 -16 L -45 -22" stroke="#3e4a26" stroke-width="0.6" opacity="0.5"/>
    <path d="M -52 -34 L -78 -38" stroke="#3e4a26" stroke-width="0.6" opacity="0.5"/>
  </g>

  <line x1="220" y1="448" x2="380" y2="448" stroke="url(#goldThinB)" stroke-width="0.8"/>

  <g font-family="'Cinzel','Cormorant Garamond',Georgia,serif" text-anchor="middle">
    <text x="300" y="490" font-size="36" font-weight="500"
          fill="url(#goldB)" letter-spacing="6">QUEENS</text>
  </g>
  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle">
    <text x="300" y="520" font-size="13" font-weight="500"
          fill="#e8e6df" letter-spacing="6">BELLY BUTTON</text>
    <text x="300" y="548" font-size="9" font-weight="500"
          fill="#8aa5d6" letter-spacing="3.5">HOSPITALITY MANAGEMENT SOFTWARE</text>
  </g>
</svg>
