  <g font-family="Inter, system-ui, sans-serif">
    <text x="195" y="100" font-size="38" font-weight="600" fill="#0d1117" letter-spacing="-1">Queen's Bellybutton</text>
    <text x="195" y="138" font-size="13" font-weight="500" fill="#475569" letter-spacing="3" text-transform="uppercase">El ombligo de la reina · plataforma F&amp;B</text>
