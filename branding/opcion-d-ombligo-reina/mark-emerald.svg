<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Queen's Bellybutton · El ombligo de la reina">
  <defs>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Fondo cuadrado con bordes suaves · coherente con resto de opciones -->
  <rect width="512" height="512" rx="112" fill="url(#gd)"/>

  <!-- Corona muy estilizada · tres puntos sutiles arriba (la "reina") -->
  <g fill="#0d1117">
    <circle cx="200" cy="138" r="11"/>
    <circle cx="256" cy="116" r="14"/>
    <circle cx="312" cy="138" r="11"/>
  </g>

  <!-- Anillo abierto · el ombligo, conexión continua que NO se cierra del todo
       La apertura en la parte inferior sugiere "cordón umbilical", flujo, vínculo -->
  <path
    d="M 256 174
       a 96 96 0 1 1 -42 182"
    fill="none"
    stroke="#0d1117"
    stroke-width="34"
    stroke-linecap="round"/>

  <!-- Punto central · el núcleo, el centro alrededor del que todo gira -->
  <circle cx="256" cy="270" r="28" fill="#0d1117"/>
</svg>
